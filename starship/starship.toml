# starship - prompt izquierdo (oh-my-zsh sigue activo para plugins/completion)
add_newline = true
command_timeout = 500
continuation_prompt = "[▸▹ ](dimmed white)"

format = """$username$hostname$directory$git_branch$git_status$git_metrics$conda$python$nodejs$rust$golang$docker_context$package$jobs$cmd_duration$line_break$character"""

right_format = """$time"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[username]
format = "[$user]($style)"
style_user = "bold yellow"
style_root = "bold red"
show_always = false

[hostname]
format = "[@$hostname]($style) "
style = "dimmed white"
ssh_only = true

[directory]
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " 󰌾"
style = "bold cyan"
repo_root_style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "🏳"
up_to_date = ""
untracked = "🤷"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
stashed = "📦"

[git_metrics]
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"
disabled = false
only_nonzero_diffs = true

[cmd_duration]
min_time = 2000
format = "[󰔚 $duration]($style) "
style = "dimmed white"

[jobs]
format = "[$symbol$number]($style) "
style = "dimmed white"
symbol = "✦"

[conda]
format = "[$symbol$environment]($style) "
symbol = "🅒 "
style = "bold green"

[python]
format = "[$symbol$version]($style) "
symbol = "🐍 "
version_format = "${raw}"
style = "bold yellow"

[nodejs]
format = "[$symbol$version]($style) "
symbol = "⬢ "
version_format = "${raw}"
style = "bold green"

[rust]
format = "[$symbol$version]($style) "
symbol = "🦀 "
version_format = "${raw}"
style = "bold red"

[golang]
format = "[$symbol$version]($style) "
symbol = "🐹 "
version_format = "${raw}"
style = "bold cyan"

[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "bold blue"

[package]
format = "[$symbol$version]($style) "
symbol = "📦 "
version_format = "${raw}"
style = "dimmed white"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
style = "dimmed white"
